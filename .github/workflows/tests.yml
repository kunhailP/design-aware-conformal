name: tests

on:
  push:
    branches: [main, "repair/**"]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Contract tests (theorem <-> code)
        run: python -m pytest tests/ -q
      - name: Fast no-data experiments smoke
        run: |
          python -m pcb.experiments.e32_severity
          python -m pcb.experiments.e28_wrong_unit_coverage

  r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: R CMD check (golden cross-language tests)
        run: |
          cd rpkg
          R CMD build dapcb --no-build-vignettes
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check dapcb_*.tar.gz --no-manual --ignore-vignettes
      - name: Fail on ERROR/WARNING
        run: "! grep -E 'Status.*(ERROR|WARNING)' rpkg/dapcb.Rcheck/00check.log"
