[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-conformal"
version = "1.0.0"
description = "Design-aware population conformal bands (DAPCB): finite-sample simultaneous bands for repeated cross-national surveys and small-area estimates"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kunwoo Park", email = "pkw31386094@gmail.com" }]
keywords = ["conformal prediction", "survey inference", "small-area estimation",
            "simultaneous bands", "political methodology"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "scikit-learn>=1.4", "lightgbm>=4", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["pcb*"]
